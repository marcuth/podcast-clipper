name: Release binaries

# Runs when a release is published on GitHub and attaches one archive per platform to it.
# "Run workflow" rebuilds the binaries for an existing tag (e.g. after a failed run).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the binaries to (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
          - label: macOS (Apple Silicon)
            os: macos-latest
          - label: Linux x64
            os: ubuntu-22.04

    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build the web interface
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libnss3 libasound2

      - name: Set up FFmpeg (bundled into the app)
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Poetry and the Python dependencies
        run: |
          python -m pip install --upgrade pip poetry
          poetry config virtualenvs.in-project true
          poetry install --no-interaction
          poetry run pip install pyinstaller

      - name: Install the Qt web view (Linux window backend)
        if: runner.os == 'Linux'
        run: poetry run pip install "pywebview[qt]"

      - name: Build and package the app
        run: poetry run python scripts/build_app.py --package

      - name: Upload the archive to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/PodcastClipper-*.zip
            dist/PodcastClipper-*.tar.gz
          fail_on_unmatched_files: true

      - name: Keep the archive as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PodcastClipper-${{ runner.os }}
          path: |
            dist/PodcastClipper-*.zip
            dist/PodcastClipper-*.tar.gz
          retention-days: 7
